<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>依恋类型 · 恋爱风格测试｜你在亲密关系里的默认设置</title>
<meta name="description" content="24 道题，约 4 分钟，测出你在亲密关系里的依恋类型：8 种恋爱模式、焦虑/回避/外显三维分布、相处合拍与易耗类型，完整报告与结果海报全部免费。">
<style>
  :root{
    --bg-0:#0B0710;--bg-1:#140A18;--bg-2:#1C0E1F;
    --line:rgba(255,255,255,.085);
    --text:#F3EAF3;--muted:#B9A3B8;--dim:#8A7690;
    --accent:#FF85A8;--accent-soft:rgba(255,133,168,.14);
    --radius:20px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg-0);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg::before{content:"";position:absolute;left:50%;top:-20%;width:780px;height:780px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,133,168,.18),rgba(255,133,168,0) 62%);filter:blur(6px)}
  .bg::after{content:"";position:absolute;left:-18%;bottom:-24%;width:660px;height:660px;background:radial-gradient(circle,rgba(142,155,255,.14),rgba(142,155,255,0) 64%)}
  .grain{position:absolute;inset:0;opacity:.5}
  .grain i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 4.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.8}}
  #app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;padding:0 22px}
  .screen.active{display:flex;animation:screenIn .5s cubic-bezier(.22,.9,.3,1)}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.16em;color:var(--dim);padding-top:max(46px,env(safe-area-inset-top))}
  .brand span.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:beat 2.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.5);opacity:.5}}

  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 20px}
  .hero h1{font-size:36px;line-height:1.26;font-weight:800;letter-spacing:-.02em;background:linear-gradient(158deg,#FFFFFF 18%,#FFC3D5 62%,#FF85A8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero h1 em{font-style:normal;display:block}
  .hero .lead{margin-top:15px;font-size:15px;line-height:1.85;color:var(--muted)}
  .hero .lead strong{color:var(--text);font-weight:600}
  .grid-preview{margin-top:23px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mini{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--line);min-width:0}
  .mini .mk{flex:0 0 17px;width:17px;height:17px;display:grid;place-items:center}
  .mini .mk svg{width:100%;height:100%}
  .mini .mtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .mini b{font-size:12px;font-weight:600;color:#DCCEDB;letter-spacing:.01em;white-space:nowrap}
  .mini s{font-size:10px;line-height:1.35;text-decoration:none;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid-hint{margin-top:10px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--dim)}
  .meta{display:flex;align-items:center;justify-content:center;gap:11px;font-size:12.5px;color:var(--dim);margin-bottom:16px;flex-wrap:wrap}
  .meta i{width:3px;height:3px;border-radius:50%;background:var(--dim)}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:17px;border:none;border-radius:16px;font-family:var(--font);font-size:16.5px;font-weight:700;color:#1A0A12;background:linear-gradient(135deg,#FFFFFF,#FFD3DF);box-shadow:0 12px 32px -12px rgba(255,133,168,.75);cursor:pointer;transition:transform .18s}
  .cta:active{transform:scale(.975)}
  .cta svg{width:16px;height:16px}
  .foot-note{margin:13px 0 calc(86px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--dim);line-height:1.7}

  #quiz{padding-top:max(18px,env(safe-area-inset-top))}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 16px}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:50%;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;transition:.18s}
  .icon-btn:active{background:rgba(255,255,255,.13);transform:scale(.94)}
  .icon-btn svg{width:16px;height:16px}
  .progress-count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .progress-count b{color:var(--text);font-size:15px}
  /* ===== 答题进度：随进度移动的精致小人（颜色随实时倾向过渡） ===== */
  .prog-stage{position:relative;margin:2px 0 14px;padding-top:34px}
  .bar-wrap{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.07)}
  .bar-fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#FF85A8,#FFC08E);transition:width .45s cubic-bezier(.4,0,.2,1)}
  .walker{position:absolute;top:-28px;left:0;width:54px;height:54px;margin-left:-27px;display:grid;place-items:center;color:var(--wc,#FF85A8);transition:left .5s cubic-bezier(.4,0,.2,1),color .45s,opacity .3s;z-index:2;will-change:left}
  .walker.idle{opacity:.45}
  .walker .halo{position:absolute;inset:3px;border-radius:50%;border:1px solid currentColor;opacity:.3;animation:haloPulse 2.6s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{opacity:.22;transform:scale(1)}50%{opacity:.55;transform:scale(1.12)}}
  .walker .avatar{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.16),rgba(18,9,22,.94) 60%);border:1.5px solid currentColor;box-shadow:0 8px 20px -10px currentColor,0 0 0 4px rgba(255,255,255,.03);transition:box-shadow .45s}
  .walker .avatar>svg{width:31px;height:37px}
  .walker .wmark{position:absolute;right:-4px;top:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#150B19;border:1px solid currentColor;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 10px -2px currentColor;transition:opacity .35s,transform .35s}
  .walker .wmark svg{width:11px;height:11px}
  .walker .wmark.empty{opacity:0;transform:scale(.6)}
  .walker.pop .avatar{animation:walkerPop .52s cubic-bezier(.22,1.4,.4,1)}
  @keyframes walkerPop{0%{transform:scale(.72)}55%{transform:scale(1.13)}100%{transform:scale(1)}}
  /* 精致小人：身体轻浮 + 四肢走路摆动（仅用 transform，保持 60fps） */
  .walker .figure{transform-box:fill-box;transform-origin:50% 96%;animation:figBob 1.5s ease-in-out infinite}
  @keyframes figBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  .walker .p-arm,.walker .p-leg{transform-box:fill-box}
  .walker .p-arm{transform-origin:50% 8%}
  .walker .p-arm.l{animation:armSwingL 1.5s ease-in-out infinite}
  .walker .p-arm.r{animation:armSwingR 1.5s ease-in-out infinite}
  @keyframes armSwingL{0%,100%{transform:rotate(13deg)}50%{transform:rotate(-11deg)}}
  @keyframes armSwingR{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(11deg)}}
  .walker .p-leg{transform-origin:50% 4%}
  .walker .p-leg.l{animation:legStepL 1.5s ease-in-out infinite}
  .walker .p-leg.r{animation:legStepR 1.5s ease-in-out infinite}
  @keyframes legStepL{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
  @keyframes legStepR{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @media (prefers-reduced-motion:reduce){.walker .halo,.walker .figure,.walker .p-arm,.walker .p-leg{animation:none!important}}
  .q-index{font-size:12px;letter-spacing:.16em;color:var(--dim);margin-bottom:11px}
  .q-title{font-size:23px;line-height:1.5;font-weight:700;letter-spacing:-.01em;margin-bottom:26px;min-height:69px}
  .options{display:flex;flex-direction:column;gap:10px;padding-bottom:104px}
  .quiz-foot{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;padding:14px 22px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;z-index:2;background:linear-gradient(to top,rgba(11,7,16,.97) 34%,rgba(11,7,16,.66) 72%,rgba(11,7,16,0));pointer-events:none}
  .prev-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:11px 17px;border-radius:100px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);backdrop-filter:blur(10px);color:var(--muted);font-family:var(--font);font-size:13px;cursor:pointer;transition:transform .16s,background .18s,opacity .2s}
  .prev-btn:active{transform:scale(.97);background:rgba(255,255,255,.11)}
  .prev-btn:disabled{opacity:.3;pointer-events:none}
  .prev-btn svg{width:13px;height:13px}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;padding:16px 17px;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.045);border:1px solid var(--line);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.5;transition:background .18s,border-color .18s,transform .14s}
  .opt:active{transform:scale(.98)}
  .opt .radio{flex:0 0 19px;width:19px;height:19px;border-radius:50%;border:1.5px solid rgba(255,255,255,.26);transition:.18s}
  .opt.chosen{background:var(--accent-soft);border-color:var(--accent)}
  .opt.chosen .radio{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}

  #analyzing{justify-content:center;align-items:center;text-align:center}
  .scan{position:relative;width:160px;height:160px;margin-bottom:36px;display:grid;place-items:center}
  .scan .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,133,168,.28);animation:pulse 2.6s ease-out infinite}
  .scan .ring:nth-child(2){animation-delay:.87s}
  .scan .ring:nth-child(3){animation-delay:1.74s}
  @keyframes pulse{0%{transform:scale(.5);opacity:0}30%{opacity:.85}100%{transform:scale(1);opacity:0}}
  .scan .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,133,168,.26),rgba(255,133,168,0) 32%,rgba(255,133,168,0));animation:spin 3.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scan .core{position:relative;width:62px;height:62px;display:grid;place-items:center;color:#FFD3DF}
  .scan .core svg{width:34px;height:34px;animation:beat 1.3s ease-in-out infinite}
  .scan-text{font-size:16px;color:var(--muted);letter-spacing:.04em;min-height:24px}
  .scan-hint{margin-top:12px;font-size:12.5px;color:var(--dim)}

  #result{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .reveal-badge{display:inline-flex;align-items:center;gap:7px;align-self:center;padding:7px 14px;border-radius:100px;margin-bottom:18px;font-size:11.5px;letter-spacing:.16em;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(255,255,255,.12)}
  .reveal-badge svg{width:13px;height:13px}
  .emblem-wrap{position:relative;display:flex;justify-content:center;margin-bottom:6px}
  .emblem-wrap::before{content:"";position:absolute;top:50%;left:50%;width:168px;height:168px;margin:-84px 0 0 -84px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0%,rgba(255,133,168,0) 72%);filter:blur(10px);opacity:.55;pointer-events:none}
  .emblem{position:relative;width:132px;height:132px;filter:drop-shadow(0 12px 30px var(--glow));z-index:1}
  .emblem svg{width:100%;height:100%;color:var(--accent)}
  .emblem.enter{animation:emblemIn .85s cubic-bezier(.18,1.3,.36,1) both}
  @keyframes emblemIn{0%{transform:scale(.45) rotate(-10deg);opacity:0}60%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}
  .emblem.tap::after{content:"";position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--accent);animation:ripple .8s ease-out forwards}
  @keyframes ripple{0%{transform:scale(.55);opacity:.85}100%{transform:scale(2.7);opacity:0}}
  .type-name{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-size:33px;font-weight:800;letter-spacing:.02em}
  .type-sym{flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--accent-soft),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 4px 12px -5px var(--accent);align-self:center;margin-top:3px;transition:transform .35s cubic-bezier(.22,1.3,.36,1)}
  .type-sym:hover{transform:scale(1.08) rotate(-4deg)}
  .type-sym svg{width:19px;height:19px}
  .type-alias{text-align:center;margin-top:7px;font-size:13.5px;color:var(--accent);letter-spacing:.06em}
  .tagline{text-align:center;margin:15px auto 0;max-width:330px;font-size:16.5px;line-height:1.7;color:#F0E2EE}
  .family-note{text-align:center;margin:14px auto 26px;max-width:340px;font-size:12.5px;line-height:1.7;color:var(--dim)}

  .panel{background:rgba(255,255,255,.038);border:1px solid var(--line);border-radius:var(--radius);padding:19px 18px;margin-bottom:13px}
  .panel-title{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;color:var(--dim);margin-bottom:15px}
  .panel-title::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent);opacity:.8}
  /* ===== 结果页 Bento 核心区（2 列栅格，卡片错落） ===== */
  .bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .b-card{position:relative;min-width:0;padding:15px 15px 16px;border-radius:18px;background:rgba(255,255,255,.042);border:1px solid var(--line)}
  .b-card.span2,.bento .praise-card{grid-column:span 2}
  .b-card.rel-card{margin-bottom:12px;padding:15px 0 14px}
  .b-card.rel-card>.b-head,.b-card.rel-card>.hs-title,.b-card.rel-card>.rel-note{margin-left:15px;margin-right:15px}
  .b-head{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.13em;color:var(--dim);margin-bottom:11px}
  .b-head::before{content:"";width:3px;height:10px;border-radius:2px;background:var(--accent);opacity:.8}
  /* 三维分布：一排三张迷你指标卡 */
  .mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mcard{position:relative;padding:11px 11px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
  .mcard .mlab{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
  .mcard .mval{display:block;margin-top:4px;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
  .mcard .mtag{position:absolute;top:9px;right:9px;font-size:9.5px;padding:2px 6px;border-radius:100px;color:var(--dim);background:rgba(255,255,255,.06)}
  .mcard .mtag.hi{color:var(--accent);background:var(--accent-soft)}
  .mcard .mbar{display:block;margin-top:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
  .mcard .mbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--accent),#FFD3A8);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .dim-note{margin-top:13px;font-size:11.5px;line-height:1.7;color:var(--dim)}
  /* ===== 闪光点高亮卡（渐变描边） ===== */
  .praise-card{position:relative;padding:17px 17px 16px;border-radius:18px;border:1px solid transparent;background:linear-gradient(rgba(28,14,31,.92),rgba(28,14,31,.92)) padding-box,linear-gradient(140deg,var(--accent),rgba(255,255,255,.14) 55%,rgba(255,255,255,.05)) border-box}
  .praise-card .pc-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;font-size:11px;letter-spacing:.14em;color:var(--accent)}
  .praise-card .pc-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .praise-card p{font-size:14.5px;line-height:1.85;color:#F2E7F0}
  /* 关键数据紧凑格 */
  .bstats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .bstat{padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .bstat b{display:block;font-size:13px;font-weight:700;line-height:1.35;color:var(--text)}
  .bstat span{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.02em;color:var(--dim)}
  /* 同家族类型竖排（可点按查看详情） */
  .bfam{display:flex;flex-direction:column;gap:7px}
  .b-card.fam-card{display:flex;flex-direction:column}
  .b-card.fam-card .bfam{flex:1;justify-content:center}
  .bfam .chip{display:block;width:100%;text-align:center;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
  .bfam .chip:active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26)}
  .fam-hint{display:block;margin-top:5px;font-size:10px;letter-spacing:.03em;color:var(--dim);text-align:center}
  /* ===== 关系搭配：均分网格（全部完整展示，不截断） ===== */
  .hs-title{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
  .hs-title.t2{margin-top:14px}
  .hs-title .pair-count{margin-left:auto}
  .pair-dot.red{background:#FF8C78;box-shadow:0 0 8px rgba(255,140,120,.5)}
  .hs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0;padding:0 15px 2px}
  .hs-card{min-width:0;padding:12px 12px 13px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;transition:transform .16s,border-color .2s,background .2s}
  .hs-card:active{transform:scale(.985)}
  .hs-card.good{border-color:rgba(79,224,184,.26);background:rgba(79,224,184,.055)}
  .hs-card.bad{border-color:rgba(255,140,120,.24);background:rgba(255,140,120,.05)}
  .hs-sym{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#8FF0D2;background:linear-gradient(145deg,rgba(79,224,184,.16),rgba(255,255,255,.02));border:1px solid rgba(79,224,184,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .hs-card.bad .hs-sym{color:#FFB1A3;background:linear-gradient(145deg,rgba(255,140,120,.16),rgba(255,255,255,.02));border-color:rgba(255,140,120,.3)}
  .hs-sym svg{width:15px;height:15px}
  .hs-card b{display:block;margin-top:9px;font-size:13px;font-weight:600;color:var(--text)}
  .hs-card i{display:block;margin-top:2px;font-size:10.5px;font-style:normal;color:var(--dim)}
  .hs-card p{margin-top:8px;font-size:11.5px;line-height:1.65;color:var(--muted)}
  /* ===== 可折叠长文分区（手风琴） ===== */
  .acc{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.038);margin-bottom:11px;overflow:hidden;transition:border-color .3s}
  .acc.open{border-color:rgba(255,255,255,.16)}
  .acc-h{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .18s}
  .acc-h:active{background:rgba(255,255,255,.035)}
  .acc-ico{flex:0 0 28px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(255,255,255,.1)}
  .acc-ico svg{width:15px;height:15px}
  .acc-h b{flex:1;font-size:13.5px;font-weight:600;letter-spacing:.03em;color:var(--text)}
  .acc-arrow{flex:0 0 16px;color:var(--dim);transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .acc-arrow svg{width:14px;height:14px;display:block}

  /* ===== 徽章：每种类型一套专属循环动作（仅用 transform / opacity，稳定 60fps） ===== */
  .emblem svg g.glyph{transform-origin:60px 60px}

  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes leaf{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-3px);opacity:.95}}
  @keyframes blip{0%,72%{opacity:.15}78%,88%{opacity:1}100%{opacity:.15}}
  @keyframes flick{0%,100%{transform:scale(1,1)}35%{transform:scale(.94,1.06)}70%{transform:scale(1.04,.96)}}
  @keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes tailWave{0%,100%{transform:translateX(-2px) rotate(-3deg)}50%{transform:translateX(2px) rotate(3deg)}}
  @keyframes bob{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
  @keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes shine{0%,100%{opacity:.15}50%{opacity:.6}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .type-modal{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(8,4,12,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  }

<script>

  {name:'安全型家族',tag:'稳',desc:'在亲密里既敢靠近，也不怕分开',color:'#4FE0B8'},

/* 每种类型的固定结构：名称 / 别名 / 一句话 / 闪光点 / 4 个数据 / 4 段解析 / 4 条建议 */
var TYPES=[
{n:'恒温型',a:'人形小太阳',t:'你爱得稳，也敢说出口。',f:0,icon:'sun',anim:'a-sun',
 st:[['秒回概率','85%'],['冷战能撑','2 小时'],['说“想你”','很经常'],['独处充电','每天 1 小时']],
 praise:'你身上有一种让人放松的能力：不用试探，也能感觉到自己被喜欢。你把“喜欢”说得出口，也接得住对方的情绪，这在亲密关系里是很稀缺的能力。',
 sec:[
  ['你在恋爱里的默认设置','你相信关系是可以沟通的。他晚回消息，你会想“他大概在忙”，而不是“他不要我了”；你难受的时候倾向说出来，而不是憋着等对方猜。你喜欢一个人，会让对方知道。'],

 ],

{n:'靠山型',a:'安静的靠山',t:'你不常说爱，但你一直在。',f:0,icon:'tree',anim:'a-tree',

 sec:[
  ['你在恋爱里的默认设置','你更习惯用做事表达在意：提前把伞放进他包里，记得他随口提过的小事。但“我喜欢你”这四个字，你可能一年也说不出几回。你觉得爱是做出来的，不是讲出来的。'],

 ],

{n:'雷达型',a:'秒回小雷达',t:'你一直在扫描：他还爱我吗？',f:1,icon:'radar',anim:'a-radar',

 sec:[
  ['你在恋爱里的默认设置','消息三小时不回，你已经把最坏的结果演了三遍；他一冷淡，你会立刻加码靠近——多发几条、多问几句、多想一点。你需要明确的回应，才能确认关系还在。'],

/* ===================== 评分 ===================== */
/* 评分基准：以随机作答的总体分布为参照，把原始总分映射成 0–1 的相对位置，
   使「50%」大致等于人群中间水平，避免各维度题量差异造成的偏斜 */
var DIM_MEAN=[50.46,57.75,43.90], DIM_SD=[4.24,4.71,4.62], DIM_SPAN=2.6;
/* 判定阈值（相对位置 0–1），经随机作答分布校准，保证 8 种类型都可达 */
var CUT_A=0.5, CUT_V=0.5, CUT_E=0.5;

function compute(sel){
  var s=[0,0,0];
  sel.forEach(function(a,i){
    var w=QUESTIONS[i].o[a].s;
    for(var k=0;k<3;k++) s[k]+=w[k];
  });
  var n=[];
  for(var k=0;k<3;k++) n.push(Math.max(0,Math.min(1,0.5+(s[k]-DIM_MEAN[k])/(DIM_SPAN*DIM_SD[k]))));
  var fam = n[1]<CUT_V ? (n[0]<CUT_A?0:1) : (n[0]<CUT_A?2:3);
  var sub = n[2]>=CUT_E ? 0 : 1;
  return {p:n, fam:fam, idx:fam*2+sub};
}

function showScreen(id){

function startQuiz(){ clearTimeout(advanceTimer); answers=[]; current=0; lastLean=-1; sfxClickPlay(); renderQuestion(); showScreen('quiz'); }
function resetQuiz(){ clearTimeout(advanceTimer); answers=[]; current=0; lastLean=-1; showScreen('intro'); }

/* 进度条 + 小人同步 */
function setProgress(r){
  var p=Math.max(0,Math.min(1,r))*100;
  document.getElementById('barFill').style.width=p+'%';
  document.getElementById('walker').style.left=p+'%';
}

/* 用已答的题估算当前倾向（按题目总数折算，避免答得少时偏斜） */
function leanData(){
  var cnt=0, s=[0,0,0];
  for(var i=0;i<QUESTIONS.length;i++){
    var a=answers[i];
    if(a==null) continue;
    cnt++;
    var w=QUESTIONS[i].o[a].s;
    for(var k=0;k<3;k++) s[k]+=w[k];
  }
  if(!cnt) return null;
  var scale=QUESTIONS.length/cnt, n=[];
  for(var k=0;k<3;k++) n.push(Math.max(0,Math.min(1,0.5+(s[k]*scale-DIM_MEAN[k])/(DIM_SPAN*DIM_SD[k]))));
  var fam=n[1]<CUT_V?(n[0]<CUT_A?0:1):(n[0]<CUT_A?2:3);
  var sub=n[2]>=CUT_E?0:1;
  return {idx:fam*2+sub, fam:fam, cnt:cnt};
}

/* 小人：颜色随当前倾向过渡，类型符号角标同步 */
function renderLean(){
  var w=document.getElementById('walker'), mk=document.getElementById('walkerMark');
  var L=leanData();
  if(!L){
    w.classList.add('idle'); w.style.removeProperty('--wc');
    mk.className='wmark empty'; mk.innerHTML='';
    lastLean=-1;
    return;
  }
  var t=TYPES[L.idx], fam=FAMILIES[t.f];
  w.classList.remove('idle');
  w.style.setProperty('--wc',fam.color);
  mk.className='wmark'; mk.innerHTML=markSVG(t.icon);
  if(lastLean!==L.idx){
    w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop');
    lastLean=L.idx;
  }
}

function renderQuestion(){
  clearTimeout(advanceTimer);
  var q=QUESTIONS[current];
  document.getElementById('qCur').textContent=current+1;
  document.getElementById('qIndex').textContent='QUESTION '+String(current+1).padStart(2,'0');
  document.getElementById('qTitle').textContent=q.q;
  document.getElementById('prevBtn').disabled=(current===0);
  setProgress(current/QUESTIONS.length);
  var box=document.getElementById('qOptions');
  box.innerHTML='';
  q.o.forEach(function(opt,idx){
    var el=document.createElement('button');
    el.className='opt'+(answers[current]===idx?' chosen':'');
    el.innerHTML='<span class="radio"></span><span>'+opt.t+'</span>';
    el.onclick=function(){ choose(idx,el); };
    box.appendChild(el);
  });
  box.style.animation='none'; void box.offsetWidth;
  box.style.animation='screenIn .38s cubic-bezier(.22,.9,.3,1)';
  renderLean();
}

function choose(idx,el){
  answers[current]=idx;
  var opts=document.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++) opts[i].classList.remove('chosen');
  el.classList.add('chosen');
  sfxClickPlay();
  setProgress((current+1)/QUESTIONS.length);
  renderLean();
  clearTimeout(advanceTimer);
  advanceTimer=setTimeout(function(){
    if(current<QUESTIONS.length-1){ current++; renderQuestion(); }
    else goAnalyze();
  },250);
}

function wrapText(ctx,text,cx,y,maxW,lineH){
  ctx.textAlign='center';
  var line='', lines=[];
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ctx.measureText(line+ch).width>maxW){ lines.push(line); line=ch; }
    else line+=ch;
  }
  if(line) lines.push(line);
  lines.forEach(function(l,i){ ctx.fillText(l,cx,y+i*lineH); });
}

    navigator.clipboard.writeText(txt).then(done)['catch'](fallback);
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动长按选择'); }

}

  toastTimer=setTimeout(function(){ el.style.opacity='0'; },1600);
}

/* ===================== 类型详情弹窗 ===================== */
/* 点击同家族类型 / 关系搭配卡片，弹出该类型的完整介绍 */
function openType(i){
  var t=TYPES[i], fam=FAMILIES[t.f];
  var stats='';
  t.st.forEach(function(x){ stats+='<div class="tm-stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'; });
  var secs='';
  t.sec.forEach(function(s){ secs+='<div class="tm-sec"><h4>'+s[0]+'</h4><p>'+s[1]+'</p></div>'; });
  var body=document.getElementById('typeModalBody');
  body.style.setProperty('--tm-c',fam.color);
  body.innerHTML=
    '<div class="tm-head">'
    +'<span class="tm-sym" style="color:'+fam.color+';background:'+hexA(fam.color,.14)+';border-color:'+hexA(fam.color,.4)+'">'+markSVG(t.icon)+'</span>'
    +'<div><div class="tm-name" id="tmName">'+t.n+'</div><div class="tm-alias">「'+t.a+'」</div></div></div>'
    +'<div class="tm-fam">'+fam.name+' · '+fam.desc+'</div>'
    +'<p class="tm-tagline">'+t.t+'</p>'
    +'<div class="tm-praise"><span>你的闪光点</span><p>'+t.praise+'</p></div>'
    +'<div class="tm-stats">'+stats+'</div>'
    +secs;
  var ov=document.getElementById('typeModal');
  ov.classList.add('show');
  ov.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  ov.querySelector('.tm-panel').scrollTop=0;
}
function closeType(){
  var ov=document.getElementById('typeModal');
  if(!ov||!ov.classList.contains('show')) return;
  ov.classList.remove('show');
  ov.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeType(); });

/* ===================== 音频：真实素材（点击音 / 完成音 / 双场景 BGM） ===================== */
var A_DIR='audio/';
var musicOn=false, bgmPending=false;
var bgmAudio=null, bgmKey=null;
/* BGM 片段：答题/首页 12~72s，结果页 8~68s（避开开头重起音，首尾平缓可循环） */
var BGM_DEF={
  quiz:{src:A_DIR+'bgm-quiz.mp3',start:12,end:72,vol:.5},
  result:{src:A_DIR+'bgm-result.mp3',start:8,end:68,vol:.42}
};
var sfxClick=null, sfxComplete=null;

function initSfx(){
  if(sfxClick) return;
  sfxClick=new Audio(A_DIR+'click.mp3'); sfxClick.preload='auto';
  sfxComplete=new Audio(A_DIR+'complete.mp3'); sfxComplete.preload='auto';
}
function playSfx(a,vol){
  if(!a) return;
  try{
    a.pause(); a.currentTime=0; a.volume=vol;
    var p=a.play(); if(p&&p.catch) p.catch(function(){});
  }catch(e){}
}
function sfxClickPlay(){ initSfx(); playSfx(sfxClick,0.4); }
function sfxCompletePlay(){ initSfx(); playSfx(sfxComplete,0.35); }

/* 音量渐变（HTMLAudioElement 无原生渐变，用定时器插值） */
function fadeTo(a,target,ms,done){
  if(!a) return;
  if(a._ft){ clearInterval(a._ft); a._ft=null; }
  var from=a.volume, t0=Date.now();
  if(!ms||ms<=0){ a.volume=target; if(done) done(); return; }
  a._ft=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/ms);
    a.volume=Math.max(0,Math.min(1,from+(target-from)*k));
    if(k>=1){ clearInterval(a._ft); a._ft=null; if(done) done(); }
  },40);
}
function ensureBgm(key){
  if(bgmAudio&&bgmKey===key) return bgmAudio;
  var d=BGM_DEF[key];
  var a=new Audio(d.src);
  a.preload='auto'; a.loop=false; a.volume=0;
  a.addEventListener('loadedmetadata',function(){
    if(!a._seeded){ a._seeded=true; try{ a.currentTime=d.start; }catch(e){} }
  });
  a.addEventListener('timeupdate',function(){
    if(a.currentTime>=d.end-0.05){ try{ a.currentTime=d.start; }catch(e){} }
  });
  bgmAudio=a; bgmKey=key;
  return a;
}
function playBgm(key){
  if(!musicOn) return;
  if(bgmKey!==key&&bgmAudio){
    var old=bgmAudio;
    fadeTo(old,0,600,function(){ try{ old.pause(); }catch(e){} });
    bgmAudio=null; bgmKey=null;
  }
  var a=ensureBgm(key), d=BGM_DEF[key];
  /* 等元数据就绪再定位到片段起点播放，避免先播开头再跳到 12s 的突兀感 */
  var begin=function(){
    try{
      if(a.paused){
        if(a.currentTime<d.start||a.currentTime>=d.end) a.currentTime=d.start;
        var p=a.play(); if(p&&p.catch) p.catch(function(){});
      }
    }catch(e){}
    fadeTo(a,d.vol,900);
  };
  if(a.readyState>=1) begin();
  else a.addEventListener('loadedmetadata',function h(){
    a.removeEventListener('loadedmetadata',h);
    if(musicOn&&a===bgmAudio) begin();
  });
}
function stopBgm(){
  if(!bgmAudio) return;
  var a=bgmAudio;
  fadeTo(a,0,700,function(){ try{ a.pause(); }catch(e){} });
}
/* 结果页用 daydreamer，其余（首页/答题/分析中）用 soft piano */
function currentBgmKey(){
  var r=document.getElementById('result');
  return (r&&r.classList.contains('active'))?'result':'quiz';
}
function syncBgm(){
  if(!musicOn) return;
  var key=currentBgmKey();
  if(bgmKey===key&&bgmAudio&&!bgmAudio.paused) return;
  playBgm(key);
}
function toggleMusic(){
  musicOn=!musicOn;
  setMusicBtn(musicOn);
  try{ localStorage.setItem('att_music',musicOn?'1':'0'); }catch(e){}
  if(musicOn) playBgm(currentBgmKey());
  else stopBgm();
}

function setMusicBtn(on){
  var b=document.getElementById('musicBtn');
  b.classList.toggle('on',on);
  b.setAttribute('aria-pressed',on?'true':'false');
  b.title='背景音乐：'+(on?'开启':'关闭');
}

/* 恢复上次的音乐开关状态；受浏览器自动播放限制，需等首次用户手势再启动 */
(function(){
  try{
    if(localStorage.getItem('att_music')==='1'){
      musicOn=true; setMusicBtn(true); bgmPending=true;
    }
  }catch(e){}
  document.addEventListener('pointerdown',function once(){
    if(bgmPending){ bgmPending=false; playBgm(currentBgmKey()); }
    document.removeEventListener('pointerdown',once);
  },{passive:true});
})();
</script>
